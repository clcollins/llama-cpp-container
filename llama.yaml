apiVersion: v1
kind: Pod
metadata:
  name: llama-cpp
  labels:
    app.kubernetes.io/name: llama-cpp
spec:
  containers:
    - name: llama-server
      image: quay.io/clcollins/llama-cpp:latest
      ports:
        - name: http
          containerPort: 8080
          hostPort: 8080
          protocol: TCP
      env:
        - name: LLAMA_ARG_HOST
          value: "0.0.0.0"
        - name: LLAMA_ARG_PORT
          value: "8080"
        - name: LLAMA_ARG_MODEL
          value: "/models/model.gguf"
      volumeMounts:
        - name: models
          mountPath: /models
  volumes:
    - name: models
      hostPath:
        path: ./models
        type: Directory
